# JHMDB split 1, clean frames. Built by scripts/prepare_jhmdb_bkind.py (repo root).
# Based on custom_dataset.yaml; only data paths, nkpts, image_size, frame_gap and batch_size differ.

# Dataset
dataset: custom_dataset
data: D:/datasets/keypoint/JHMDB_bkind/split1   # contains train/ and val/

# Training information
workers: 4
epochs: 30
start_epoch: 0
schedule: 30
batch_size: 16          # 32 (Human3.6M setting) filled the 8 GB GPU and spilled to system RAM: 4.8 s/iter
lr: 0.001
momentum: 0.9
weight_decay: 0.0001
print_freq: 10
pretrained: True
gpu: 0
val_schedule: 20
curriculum: 4

# Path to save checkpoint
checkpoint: checkpoint/JHMDB_split1
# Specify number of keypoints
nkpts: 10               # as BKinD used for Human3.6M; mapped to JHMDB's 15 joints at evaluation

# Hyperparameters
image_size: 128         # as BKinD used for Human3.6M; fits the 8 GB GPU
frame_gap: 6            # ~0.2 s at 30 fps (BKinD's recommendation); shortest clips have 15 frames
bounding_box: False     # Only False allowed for the custom dataset

perc_weight: [100.0, 1.6, 2.3, 1.8, 2.8, 100.0]

# Specify model path
# resume: checkpoint/JHMDB_split1
evaluate: False
